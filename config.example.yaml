wg_gesucht:
  # Set WG_GESUCHT_EMAIL and WG_GESUCHT_PASSWORD before starting the bot.
  email: "${WG_GESUCHT_EMAIL}"
  password: "${WG_GESUCHT_PASSWORD}"

search:
  city: "Hamburg"
  # Filter by specific districts (leave empty for all)
  bezirk:
    - "Altona-Altstadt"
    - "Altona-Nord"
    - "Eimsbuettel"
  max_price: 650
  min_size: 0
  # Categories: 0=WG-Zimmer, 1=1-Zimmer-Wohnung, 2=Wohnung, 3=Haus
  categories: "0"
  limit: 20  # offers per page
  max_pages: 5  # pages to scan before stopping
  target_filtered_offers: 0  # 0 = auto (max_messages_per_run)
  contact_zwischenmiete: false  # Set true to include time-limited offers

llm:
  enabled: false
  # Supported: gemini, anthropic, openai, openrouter, groq, together, openai_compatible
  provider: "gemini"
  api_key: "${LLM_API_KEY:-}"  # Set LLM_API_KEY when personalization is enabled
  model: "gemini-1.5-flash"
  # Optional custom endpoint (mostly for OpenAI-compatible providers)
  base_url: ""

settings:
  interval_minutes: 20
  max_messages_per_run: 2
  delay_between_messages: 20  # seconds between messages
  dry_run: true  # Set to false to actually send messages
  mark_contacted_in_dry_run: false  # Track dry-run offers as contacted
  contact_email: ""  # Optional: include if asked in description
  contact_phone: ""  # Optional: include if asked in description
